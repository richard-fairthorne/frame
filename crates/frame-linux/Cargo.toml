[package]
name = "frame-linux"
version = "0.1.0"
edition = "2021"

[dependencies]
frame-core = { path = "../frame-core" }
slotmap = "1"

[target.'cfg(target_os = "linux")'.dependencies]
frame-rendering = { path = "../frame-rendering" }
frame-input = { path = "../frame-input" }
gtk = { version = "0.18", features = ["v3_24"] }
glib = "0.18"
vello = "0.4"
raw-window-handle = "0.6"

[dev-dependencies]
frame-ui = { path = "../frame-ui" }
