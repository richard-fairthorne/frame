[package]
name = "frame-windows"
version = "0.1.0"
edition = "2021"

[dependencies]
frame-core = { path = "../frame-core" }
slotmap = "1"

[target.'cfg(target_os = "windows")'.dependencies]
frame-rendering = { path = "../frame-rendering" }
frame-input = { path = "../frame-input" }
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
] }
vello = "0.4"
raw-window-handle = "0.6"
