[package]
name = "counter"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]

[[bin]]
name = "counter"
path = "src/main.rs"

[workspace]

[dependencies]
frame = { path = "../../crates/frame" }

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6", features = ["native-activity"] }
ndk = "0.9"
frame-android = { path = "../../crates/frame-android" }
