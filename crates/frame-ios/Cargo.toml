[package]
name = "frame-ios"
version = "0.1.0"
edition = "2021"

[dependencies]
frame-core = { path = "../frame-core" }
frame-input = { path = "../frame-input" }
frame-rendering = { path = "../frame-rendering" }
slotmap = "1"

[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-ui-kit = "0.3"
objc2-quartz-core = { version = "0.3", features = ["CAMetalLayer", "CALayer"] }
block2 = "0.6"
vello = "0.4"